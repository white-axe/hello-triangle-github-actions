name: Build

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  linux:
    name: Linux ${{ matrix.windowing }} ${{ matrix.graphics }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        windowing:
          - wayland
          - x11
        graphics:
          - opengl
          - vulkan
    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake git meson pkgconf
          sudo apt install -y gcc g++
          sudo apt install -y glslc # SPIR-V compiler for Vulkan
          sudo apt install -y libegl-mesa0 libglx-mesa0 mesa-libgallium mesa-vulkan-drivers # Mesa
          sudo apt install -y libegl1 libgl1 libgles2 libglx0 libopengl0 libgles2 # libglvnd (provides the OpenGL .so files, delegates to Mesa for the actual implementation of OpenGL)
          sudo apt install -y libvulkan1 # Vulkan loader (provides libvulkan.so, delegates to Mesa for the actual implementation of Vulkan)
          sudo apt install -y cage libwayland-dev libxkbcommon-dev xwayland-run # Wayland
          sudo apt install -y libx11-dev libx11-xcb-dev libxcursor-dev libxext-dev libxi-dev libxinerama-dev libxrandr-dev xvfb # X11

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure
        run: |
          meson setup build ${{ matrix.graphics }}

      - name: Build
        run: |
          ninja -C build -v

      - name: Run
        run: |
          if [ '${{ matrix.windowing }}' = 'wayland' ]
          then
            wlheadless-run -c cage -- ./build/triangle release
          else
            xvfb-run ./build/triangle release
          fi
          mv triangle.png triangle-linux-${{ matrix.windowing }}-${{ matrix.graphics }}.png

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: triangle-linux-${{ matrix.windowing }}-${{ matrix.graphics }}.png
          archive: false

  macos:
    name: macOS ${{ matrix.graphics }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        graphics:
          - metal
          - opengl
          - vulkan
    steps:
      - name: Install dependencies
        run: |
          brew install -q cmake git meson pkgconf
          brew install -q shaderc # SPIR-V compiler for Vulkan
          brew install -q mesa # Mesa
          brew install -q vulkan-loader # Vulkan loader (provides libvulkan.dylib, delegates to Mesa for the actual implementation of Vulkan)

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure
        run: |
          meson setup build ${{ matrix.graphics }}

      - name: Build
        run: |
          ninja -C build -v

      - name: Run
        run: |
          export DYLD_LIBRARY_PATH="$(brew --prefix vulkan-loader)/lib:$DYLD_LIBRARY_PATH" # Add Vulkan loader to the dynamic linker path since it's not there by default
          ./build/triangle release
          mv triangle.png triangle-macos-${{ matrix.graphics }}.png

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: triangle-macos-${{ matrix.graphics }}.png
          archive: false

  windows:
    name: Windows ${{ matrix.graphics }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        graphics:
          - direct3d11
          - opengl
          - vulkan
    steps:
      - name: Install dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          cache: false
          install: >-
            mingw-w64-x86_64-cmake mingw-w64-x86_64-git mingw-w64-x86_64-meson mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-shaderc
            mingw-w64-x86_64-7zip mingw-w64-x86_64-curl

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure
        shell: msys2 {0}
        run: |
          meson setup build ${{ matrix.graphics }}

      - name: Build
        shell: msys2 {0}
        run: |
          ninja -C build -v

      - name: Install Mesa
        shell: msys2 {0}
        run: |
          # Mesa provides opengl32.dll on Windows, which we can install just by putting a symbolic link to it and its dependency libgallium_wgl.dll in the same directory as our executable.
          # However, Mesa does not provide vulkan-1.dll (Vulkan loader). That's provided by the operating system.
          # To make the operating system's vulkan-1.dll use Mesa, we edit the Windows registry to register Mesa as a Vulkan driver.
          cd build
          curl --retry 5 -Lo mesa.7z https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-mingw.7z
          echo '36a30a04d8cab6e2bea2d3c747c326d15024d9711dd80f45ef97ac6f2c3c5086 *mesa.7z' | sha256sum -c
          7z x -omesa mesa.7z
          ln -s "$(realpath mesa/x64/opengl32.dll)" opengl32.dll
          ln -s "$(realpath mesa/x64/libgallium_wgl.dll)" libgallium_wgl.dll
          reg add 'HKLM\Software\Khronos\Vulkan\Drivers' -v "$(cygpath -w "$(realpath mesa/x64/lvp_icd.x86_64.json)")" -t REG_DWORD -d 0 -f

      - name: Run
        shell: msys2 {0}
        run: |
          export GALLIUM_DRIVER=llvmpipe # Force Mesa to use software rendering since we don't have a graphics card
          ./build/triangle release
          mv triangle.png triangle-windows-${{ matrix.graphics }}.png

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: triangle-windows-${{ matrix.graphics }}.png
          archive: false
